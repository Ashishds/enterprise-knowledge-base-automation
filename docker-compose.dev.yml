version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: ekba-qdrant-dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333

  redis:
    image: redis:7.4-alpine
    container_name: ekba-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel notice

  postgres:
    image: postgres:16-alpine
    container_name: ekba-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ekba_dev
      POSTGRES_USER: ekba_user
      POSTGRES_PASSWORD: ekba_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:latest
    container_name: ekba-localstack-dev
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,secretsmanager,cognito-idp
      - AWS_DEFAULT_REGION=us-east-1

volumes:
  qdrant_data:
  postgres_data:
