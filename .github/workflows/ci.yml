name: EKBA CI

on:
  push:
    branches: [ main, feat/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install boto3 ruff black mypy pytest pytest-cov pytest-asyncio httpx fastapi uvicorn pydantic pydantic-settings

      - name: Lint with ruff & black
        run: |
          ruff check backend/app
          black --check backend/app

      - name: Type check with mypy
        run: |
          mypy backend/app

      - name: Run pytest suite
        env:
          PYTHONPATH: .
        run: |
          pytest backend/tests


      - name: Run evaluation benchmark regression gate
        env:
          EURI_API_KEY: ${{ secrets.EURI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python backend/evals/run_eval.py

      - name: Verify no terraform destroy in workflows
        run: |
          ! grep -rn "terraform destroy" .github/workflows/
