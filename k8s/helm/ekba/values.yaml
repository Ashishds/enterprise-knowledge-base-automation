replicaCount: 3

image:
  repository: ekba/backend
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

env:
  ENVIRONMENT: "prod"
  EURI_BASE_URL: "https://api.euron.ai"
  LOG_LEVEL: "INFO"
