[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ekba"
version = "0.1.0"
description = "Enterprise Knowledge-Base Automation (EKBA) Backend"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501", # line too long handled by black
    "B008", # function calls in argument defaults (FastAPI Depends)
    "S105", # token_use false positive
    "S311", # jitter backoff non-crypto random
    "S101", # assert statements in pytest test files
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests",
    "security: Security and auth/authz tests",
    "agent: LangGraph agent and tool tests",
    "e2e: End-to-end stack tests",
    "asyncio: Asyncio tests",
]
